<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainDrop AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      background: #0a0a0f;
      color: #f0f0ff;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #4f8ff7, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header h1 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #4f8ff7, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .content { padding: 16px; }
    .quick-clip {
      width: 100%; padding: 12px;
      border-radius: 10px; border: 1px solid #2a2a4a;
      background: #12121a; color: #f0f0ff; font-size: 13px;
      resize: vertical; min-height: 80px;
      font-family: inherit;
    }
    .quick-clip:focus { outline: none; border-color: #4f8ff7; }
    .quick-clip::placeholder { color: #6a6a8a; }
    .btn {
      width: 100%; margin-top: 12px; padding: 10px;
      border: none; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: white;
      background: linear-gradient(135deg, #4f8ff7, #8b5cf6);
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      border: 1px solid #2a2a4a;
      color: #a0a0c0;
    }
    .btn-secondary:hover { border-color: #3a3a6a; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 16px;
    }
    .stat {
      padding: 12px; border-radius: 10px;
      background: #12121a; border: 1px solid #2a2a4a;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 11px; color: #6a6a8a; margin-top: 2px; }
    .stat-green .stat-value { color: #10b981; }
    .stat-blue .stat-value { color: #4f8ff7; }
    .footer {
      padding: 12px 16px; border-top: 1px solid #2a2a4a;
      text-align: center;
    }
    .footer a {
      color: #4f8ff7; text-decoration: none; font-size: 12px;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <h1>BrainDrop AI</h1>
  </div>
  <div class="content">
    <textarea class="quick-clip" placeholder="Quick note... or select text on any page and click 'Clip to BrainDrop'"></textarea>
    <button class="btn" id="save-btn">💾 Save to BrainDrop</button>
    <button class="btn btn-secondary" id="panel-btn" style="margin-top: 8px;">📋 Open Side Panel</button>
    <div class="stats">
      <div class="stat stat-green">
        <div class="stat-value" id="clip-count">0</div>
        <div class="stat-label">Clips Today</div>
      </div>
      <div class="stat stat-blue">
        <div class="stat-value" id="note-count">0</div>
        <div class="stat-label">Total Notes</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <a href="https://brain.tinonurcahya.dev" target="_blank">Open BrainDrop Dashboard →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
