    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="13" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.56  0 0 0 0 0.49  0 0 0 0 0.41  0 0 0 0.032 0" result="warmCloud"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.37  0 0 0 0 0.31  0 0 0 0.026 0" result="warmGrain"/>
    <feMerge>
