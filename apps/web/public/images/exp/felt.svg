<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="f">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="19" stitchTiles="stitch" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="29" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0.045 0" result="warmCloud"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.32  0 0 0 0 0.27  0 0 0 0.036 0" result="warmGrain"/>
    <feMerge>
      <feMergeNode in="warmCloud"/>
      <feMergeNode in="warmGrain"/>
    </feMerge>
  </filter>
  <rect width="360" height="360" filter="url(#f)"/>
</svg>
